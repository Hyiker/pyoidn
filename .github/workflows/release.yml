name: Publishing Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            ext: zip
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            ext: tar.gz
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            ext: tar.gz
          - os: macos-latest
            platform: macos
            arch: arm64
            ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Get tag version and OIDN version
        id: get_versions
        run: |
          . .github/workflows/scripts/get_versions.sh
        shell: bash

      - name: Download OIDN
        run: |
          . .github/workflows/scripts/download_oidn.sh
        env:
          OIDN_VERSION: ${{ env.OIDN_VERSION }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        shell: bash

      - name: Build and test
        run: |
          . .github/workflows/scripts/build.sh
          pip install -r requirements-test.txt
          python -m unittest discover ./tests/
        shell: bash
        continue-on-error: false

      - name: Check version consistency
        env:
            VERSION: ${{ env.VERSION }}
            OIDN_VERSION: ${{ env.OIDN_VERSION }}
        run: |
          . .github/workflows/scripts/check_version.sh
        shell: bash

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ env.VERSION }}-${{ matrix.arch }}-${{ matrix.platform }}
          path: dist/*.whl
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare distributions
        run: |
          mkdir final_dist
          find dist -name "*.whl" -exec cp {} final_dist/ \;

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          twine upload --skip-existing final_dist/*
